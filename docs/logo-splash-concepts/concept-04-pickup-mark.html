<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PickUp Concept 04 - Pickup Mark</title>
    <link rel="stylesheet" href="./shared.css" />
    <style>
      .pmark {
        position: relative;
        width: 270px;
        height: 270px;
      }

      .p-back {
        position: absolute;
        left: 52px;
        top: 48px;
        width: 166px;
        height: 190px;
        border-radius: 54px;
        background: #232327;
        transform-origin: 50% 60%;
        animation: p-back 3300ms cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }

      .p-shape {
        position: absolute;
        left: 42px;
        top: 36px;
        width: 190px;
        height: 198px;
        border: 17px solid var(--accent);
        border-radius: 62px;
        animation: p-shape 3300ms cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }

      .p-shape::after {
        content: "";
        position: absolute;
        left: 62px;
        top: 48px;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: #000;
      }

      .p-letter {
        position: absolute;
        left: 0;
        right: 0;
        top: 86px;
        text-align: center;
        color: #000;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 86px;
        font-weight: 900;
        animation: p-letter 3300ms cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }

      @keyframes p-back {
        0% { opacity: 0; transform: rotate(0deg) scale(0.86); }
        28%, 78% { opacity: 0.9; transform: rotate(-9deg) scale(1); }
        100% { opacity: 0; transform: rotate(-14deg) scale(0.96); }
      }

      @keyframes p-shape {
        0% { opacity: 0; transform: translateY(16px) scale(0.74); border-radius: 88px; }
        32%, 78% { opacity: 1; transform: translateY(0) scale(1); border-radius: 62px; }
        100% { opacity: 0; transform: translateY(-8px) scale(1.05); border-radius: 72px; }
      }

      @keyframes p-letter {
        0%, 24% { opacity: 0; transform: translateY(10px) scale(0.9); }
        40%, 78% { opacity: 1; transform: translateY(0) scale(1); }
        100% { opacity: 0; transform: translateY(-8px) scale(0.96); }
      }
    </style>
  </head>
  <body>
    <main class="board">
      <header class="topline">
        <div>
          <h1>04 Pickup Mark</h1>
          <p class="note">更像品牌符号的一版：用 P 作为核心记忆点，外轮廓仍然来自照片卡片和圆角框。</p>
        </div>
        <nav class="nav"><a href="./index.html">返回总览</a><a href="./concept-01-card-bloom.html">回到第一个</a></nav>
      </header>
      <section class="stage">
        <div class="phone">
          <div class="status"><span>13:26</span><span>5G 65</span></div>
          <div class="splash">
            <div class="pmark">
              <div class="p-back"></div>
              <div class="p-shape"></div>
              <div class="p-letter">P</div>
            </div>
            <div class="brand-name">PickUp</div>
            <div class="brand-sub">Keep what matters</div>
          </div>
        </div>
        <aside class="spec">
          <h2>方向说明</h2>
          <p>这版应用商店识别最强，因为小尺寸下 P 字母更容易被记住。代价是“照片整理”的隐喻会弱一点，需要通过开屏动画里的卡片入场补回来。</p>
          <div class="chips"><span class="chip">品牌感强</span><span class="chip">小尺寸清晰</span><span class="chip">偏英文国际化</span></div>
          <ul>
            <li>适合未来如果品牌名统一成 PickUp，并希望图标更像成熟工具 App。</li>
            <li>P 字体可以后续手工微调，避免直接使用系统字体导致普通。</li>
            <li>开屏可从卡片翻转到 P 字母，动作更有“拾起”的意味。</li>
          </ul>
          <div class="swatches"><i style="background:#a8d46f"></i><i style="background:#000"></i><i style="background:#232327"></i><i style="background:#f8f8f6"></i></div>
        </aside>
      </section>
    </main>
  </body>
</html>
